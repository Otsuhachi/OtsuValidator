[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

[project]
authors = [{ name = "Otsuhachi", email = "agequodagis.tufuiegoeris@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []
description = "A useful python package named otsuvalidator."
license = { text = "MIT License" }
name = "otsuvalidator"
readme = "README.md"
requires-python = ">=3.12"
version = "1.1.0.312"

[tool.setuptools.packages.find]
include = ["otsuvalidator*"]
where = ["."]

[tool.setuptools.package-data]
"otsuvalidator" = ["py.typed"]


[tool.ruff]
line-length = 150


[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
unfixable = ["F401"]
